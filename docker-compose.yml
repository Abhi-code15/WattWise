services:
  postgres:
    image: postgres:16-alpine
    container_name: wattwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresPassword123!
      POSTGRES_DB: wattwise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wattwise-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgresPassword123!@postgres:5432/wattwise?schema=public"
      JWT_SECRET: "wattwise-super-secret-jwt-key-2026-production-ready"
      JWT_EXPIRES_IN: "7d"
      SIMULATOR_API_KEY: "wattwise-internal-simulator-key-xyz789"
      SIMULATOR_INTERVAL_MS: 15000
      SIMULATOR_AUTOSTART: "true"
      DEFAULT_TARIFF_RATE: 7.50
      OFFLINE_TIMEOUT_SECONDS: 90
      STALE_TIMEOUT_SECONDS: 45
      HIGH_POWER_CONSECUTIVE_READINGS: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wattwise-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
